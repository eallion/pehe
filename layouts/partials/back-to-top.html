{{- if site.Params.backToTop | default site.Params.back_to_top | default true -}}
<div id="ds-btt-wrapper" class="ds-btt-wrapper fixed bottom-6 right-6 z-40">
  <button id="ds-back-to-top" type="button" aria-label="返回顶部" title="返回顶部"
    class="group relative flex items-center justify-center w-11 h-11 rounded-full bg-white/90 dark:bg-[#22272e]/90 backdrop-blur-md border border-zinc-200/80 dark:border-white/10 shadow-[0_4px_16px_rgba(0,0,0,0.1)] dark:shadow-[0_4px_20px_rgba(0,0,0,0.45)] text-zinc-700 dark:text-zinc-300 hover:text-zinc-950 dark:hover:text-cyan-300 transition-all duration-300 ease-out opacity-0 pointer-events-none translate-y-3 scale-90 cursor-pointer select-none active:scale-95">
    
    <!-- Circular SVG Reading/Scroll Progress Ring -->
    <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 44 44">
      <!-- Track circle -->
      <circle cx="22" cy="22" r="19" fill="none" stroke="currentColor" stroke-width="2.5" class="text-zinc-200/70 dark:text-white/10" />
      <!-- Active progress circle -->
      <circle id="ds-btt-progress" cx="22" cy="22" r="19" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round"
        stroke-dasharray="119.38"
        stroke-dashoffset="119.38"
        class="text-zinc-900 dark:text-cyan-400 transition-[stroke-dashoffset] duration-75 ease-out" />
    </svg>

    <!-- Center Up Arrow Icon -->
    <svg class="w-4 h-4 transition-transform duration-200 ease-out group-hover:-translate-y-0.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>
</div>

<style>
  .ds-btt-wrapper {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 40;
    transition: bottom 0.25s ease-out;
  }
  /* 移动端视口下若页面存在文章目录按钮（#toc-mobile-trigger），自动向上移位避让堆叠 */
  @media (max-width: 1023px) {
    body:has(#toc-mobile-trigger) .ds-btt-wrapper {
      bottom: 76px;
    }
  }
</style>

<script>
(function() {
  var btn = document.getElementById('ds-back-to-top');
  var progress = document.getElementById('ds-btt-progress');
  var wrapper = document.getElementById('ds-btt-wrapper');
  if (!btn || !progress) return;

  var radius = 19;
  var circumference = 2 * Math.PI * radius; // ~119.38
  progress.style.strokeDasharray = circumference;
  progress.style.strokeDashoffset = circumference;

  var isVisible = false;
  var ticking = false;

  function updateProgress() {
    var scrollY = window.scrollY || window.pageYOffset || 0;
    var docHeight = (document.documentElement.scrollHeight || document.body.scrollHeight) - window.innerHeight;
    var percent = docHeight > 0 ? Math.min(1, Math.max(0, scrollY / docHeight)) : 0;
    var offset = circumference - (percent * circumference);
    progress.style.strokeDashoffset = offset.toFixed(2);

    if (scrollY > 300) {
      if (!isVisible) {
        btn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3', 'scale-90');
        btn.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0', 'scale-100');
        isVisible = true;
      }
    } else {
      if (isVisible) {
        btn.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0', 'scale-100');
        btn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3', 'scale-90');
        isVisible = false;
      }
    }
    ticking = false;
  }

  function onScroll() {
    if (!ticking) {
      requestAnimationFrame(updateProgress);
      ticking = true;
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });

  btn.addEventListener('click', function(e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // 移动端避让目录按钮（兼容不支持 :has 的低版本浏览器）
  function checkMobileToc() {
    if (wrapper && window.innerWidth < 1024 && document.getElementById('toc-mobile-trigger')) {
      wrapper.style.bottom = '76px';
    } else if (wrapper) {
      wrapper.style.bottom = '';
    }
  }
  checkMobileToc();
  window.addEventListener('resize', checkMobileToc, { passive: true });

  // 初始计算一次
  updateProgress();
})();
</script>
{{- end -}}
