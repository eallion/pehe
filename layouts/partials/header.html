<div id="ds-header-bar" class="ds-header-bar pointer-events-auto flex items-center justify-between">
	<!-- Left: Mobile menu toggle + Logo + Title + Badge -->
	<div class="flex items-center gap-3">
		<button type="button" class="h-[38px] px-2.5 lg:px-0 lg:w-[38px] lg:h-[38px] flex items-center justify-center gap-1.5 lg:gap-0 rounded-full group ds-nav-btn toggle-button shrink-0 aspect-auto lg:aspect-square" data-target="menu-bar" aria-label="menu">
			{{ partial "icon.html" (dict "name" "menu" "class" "h-5 w-5 lg:hidden text-current shrink-0") }}
			{{ with .Site.Params.logo }}
				<span class="w-[28px] h-[28px] rounded-full flex items-center justify-center shrink-0 overflow-hidden aspect-square">
					<img src="{{ . }}" class="w-full h-full rounded-full block object-cover aspect-square" alt="logo" width="32" height="32" loading="lazy">
				</span>
			{{ else }}
				<span class="w-[28px] h-[28px] bg-blue-500 fill-white rounded-full flex items-center justify-center shrink-0 aspect-square">
					{{ partial "icon.html" (dict "name" "logo-fallback" "class" "group-hover:animate-spin bi bi-egg-fried fill-white h-4 w-4") }}
				</span>
			{{ end }}
		</button>
		<a href="/" target="_self" class="flex items-center gap-2 text-current font-medium text-[15px] tracking-tight hover:opacity-90 transition-opacity select-none" alt="{{ .Site.Title }}" aria-label="Home">
			{{- with .Site.Params.svg_title -}}
				{{- partial "icon.html" (dict "name" . "class" "h-6 text-current") -}}
			{{- else -}}
				<span class="ds-logo-text font-semibold">{{- .Site.Title -}}</span>
			{{- end -}}
			<span class="hidden sm:inline-flex items-center rounded-[8px] p-[1px]" style="background:linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.08) 35%, rgba(255,255,255,0.04) 65%, rgba(255,255,255,0.4) 100%);box-shadow:0 0 12px rgba(255,255,255,0.05)">
				<span class="pt-[2px] pb-[1px] rounded-[7px] font-mono text-[10px] font-medium leading-none px-[7px] bg-black/30 text-white/90">BLOG</span>
			</span>
		</a>
	</div>

	<!-- Right: Menu + Search + Theme Toggle -->
	<div class="flex items-center gap-2">
		{{- partial "menu.html" (dict "menuID" "main" "page" .) -}}

		<!-- Search Button -->
		<button type="button" class="ds-nav-btn w-9 h-9" data-target="search-bar" aria-label="search">
			<svg width="17" height="17" fill="currentColor" viewBox="0 0 16 16">
				<path id="path1" class="transition-all ease-linear" d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"></path>
				<path id="path2" class="transition-all ease-linear hidden" d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708-.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"></path>
			</svg>
		</button>

		<!-- Dark Mode Toggle Button -->
		<button type="button" id="theme-toggle" aria-label="Toggle Dark Mode" class="ds-nav-btn w-9 h-9">
			<svg class="hidden dark:block text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
				<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
			</svg>
			<svg class="block dark:hidden text-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
				<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
			</svg>
		</button>
	</div>
</div>
{{- partial "search.html" . -}}
