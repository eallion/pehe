<!DOCTYPE html>
<html lang="{{ or site.Language.Locale site.Language.Lang }}" dir="{{ or site.Language.Direction `ltr` }}">
	<head>
		{{ partial "head.html" . }}
	</head>
	<body class="bg-white dark:bg-bg-dimmed-primary text-gray-800 dark:text-text-dimmed-primary leading-relaxed">
		<header id="page-header" class="ds-header-wrapper">
			{{- partial "header.html" . -}}
		</header>
		<main class="max-w-7xl mx-auto px-4 md:px-6 lg:px-8 pt-20 md:pt-24">
			{{- block "main" . }}{{ end -}}
		</main>
		<footer class="bg-zinc-100 dark:bg-bg-dimmed-inset py-10 md:py-14 border-t border-zinc-200 dark:border-border-dimmed-primary">
			{{- partial "footer.html" . -}}
		</footer>
		{{- partialCached "footer/js.html" . }}
	</body>
</html>
